<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oyey</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://oyey.eu/">
  <script>
  /* Stary adres strony angielskiej. Od 08.11.2026 angielska jest pod „/”,
     a ten plik zostaje, bo linki index-en.html?ct=… siedzą w bio (instagram_en,
     facebook_en, youtube_en). Przekierowanie niesie całe zapytanie i #kotwicę.
     Celowo NIE dokłada lang=en: „/” sam rozpozna polską przeglądarkę i przeniesie
     ją na /pl/. Ta strona nie zapisuje też języka wizyty (bez nav.js). */
  try { window.location.replace('/' + window.location.search + window.location.hash); } catch (e) {}
  </script>
  <!-- Bez JS. W <noscript>, bo przy włączonym JS odświeżenie z opóźnieniem 0
       mogłoby wyprzedzić location.replace i zgubić ?ct=… -->
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body>
  <p><a href="/">oyey.eu</a></p>
</body>
</html>
